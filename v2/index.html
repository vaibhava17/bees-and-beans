<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.2-.7-.4z"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M3 5h18v14H3zM3 6l9 7 9-7"/></symbol>
      <symbol id="i-pod" viewBox="0 0 40 40"><path d="M19 8c5.5 2.6 8.4 8 7.6 14.6C25.9 28.6 23 33 19 34c-4-1-6.9-5.4-7.6-11.4C10.6 16 13.5 10.6 19 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M19 9v24M15.2 12.5c-1.4 5.5-1.4 12.5 0 18.5M22.8 12.5c1.4 5.5 1.4 12.5 0 18.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M22.5 8.5c2.4-3 6-3.8 9-2.6-1 3.2-4.6 4.8-9 2.6z" fill="currentColor"/></symbol>

  <canvas class="world" id="world" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="nav">
    <a class="mark" href="#" data-go="hero" aria-label="Bees & Beans — back to the start"><svg><use href="#i-pod"/></svg><span>Bees <i>&amp;</i> Beans</span></a>
    <nav class="nav-links" aria-label="Chapters">
      <a href="#" data-go="pod">Craft</a><a href="#" data-go="ring">What we make</a><a href="#" data-go="festive">Festive</a><a href="#" data-go="scale">Corporate</a><a href="#" data-go="story">Story</a>
    </nav>
    <a class="nav-cta" href="#" data-go="reply">Enquire</a>

  <main id="main" class="scroller" aria-label="Bees & Beans — from the cacao pod to the gift box">
    <div class="captions" id="captions"><!-- rendered by js/main.js --></div>
  </main>

  <aside class="chapter" aria-hidden="true"><b id="chNum">01</b><span id="chName">The gift</span></aside>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <a class="v1-link" href="../">Classic site</a>

  <!-- the reply card + footer, revealed at the very end of the journey -->
  <section class="reply" id="reply" aria-label="Enquire" inert>
    <div class="reply-inner">
      <div class="reply-side">
        <p class="kicker">Reply card</p>
        <h2 class="split">Tell us about <em>your gifting.</em></h2>
        <p>Share a few details and we'll come back with ideas, options and pricing — personally.</p>
        <a class="btn btn-ghost" data-wa="Hello Bees & Beans! I'd like to enquire about an order." href="#" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg>Chat on WhatsApp</a>
        <ul class="contact"><li><a data-tel href="#"></a></li><li><a data-mail href="#"></a></li><li><span data-addr></span></li></ul>
      </div>
      <form class="form" id="enqForm" novalidate>
        <div class="f-row">
          <label class="field"><span>Your name</span><input name="name" autocomplete="name" required /><em class="err"></em></label>
          <label class="field"><span>Phone number</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+91" /><em class="err"></em></label>
        </div>
        <label class="field"><span>Email <small>(optional)</small></span><input name="email" type="email" autocomplete="email" /><em class="err"></em></label>
        <fieldset class="field occ"><legend>Occasion</legend>
          <div class="occ-opts">
            <label><input type="radio" name="occasion" value="Diwali" required /><span>Diwali</span></label>
            <label><input type="radio" name="occasion" value="Christmas" /><span>Christmas</span></label>
            <label><input type="radio" name="occasion" value="New Year" /><span>New Year</span></label>
            <label><input type="radio" name="occasion" value="Other" /><span>Other</span></label>
          </div><em class="err"></em>
        </fieldset>
        <div class="f-row">
          <label class="field"><span>Interested in</span><select name="interest" required><option value="">Choose one</option></select><em class="err"></em></label>
          <label class="field"><span>Quantity</span><input name="quantity" placeholder="e.g. 50 boxes" /><em class="err"></em></label>
        </div>
        <label class="field"><span>Message <small>(optional)</small></span><textarea name="message" rows="2" placeholder="Date needed, budget, branding…"></textarea></label>
        <div class="f-actions">
          <button class="btn btn-gold" type="submit" name="via" value="whatsapp"><svg><use href="#i-wa"/></svg>Send on WhatsApp</button>
          <button class="btn btn-line" type="submit" name="via" value="email"><svg><use href="#i-mail"/></svg>Send by email</button>
        </div>
        <p class="f-status" id="fStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
    <footer class="foot" role="contentinfo">
      <p class="foot-mark" aria-hidden="true">Bees <i>&amp;</i> Beans</p>
      <p class="foot-legal">© <span id="year">2026</span> Bees &amp; Beans Handmade Chocolates · <span data-addr></span></p>
    </footer>
  </section>

  <noscript><p class="noscript">This experience needs JavaScript. <a href="../">Open the classic site</a>.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
